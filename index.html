<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Right Now — Demo Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --bg:#F6F6FB; --bg-2:#ECEBF8; --card:#FFFFFF; --card-soft:#F8F7FD;
  --text:#16152A; --text-muted:#68637E;
  --border:#E7E4F5;
  --positive:#15803D; --positive-vivid:#0CA30C; --positive-rgb:12,163,12;
  --warning:#B45309; --warning-vivid:#FAB219; --warning-rgb:250,178,25;
  --danger:#B91C1C; --danger-vivid:#E34948; --danger-rgb:227,73,72;
  --neutral:#8C8996; --neutral-rgb:140,137,150;
  --radius-card:20px; --radius-ctl:12px;
  --shadow-sm:0 1px 2px rgba(22,21,42,.05), 0 1px 1px rgba(22,21,42,.04);
  --shadow-md:0 10px 26px -6px rgba(22,21,42,.14);
  --shadow-lg:0 24px 56px -12px rgba(22,21,42,.28);
  --brand:#2563EB; --accent:#06B6D4;
  --brand-rgb:37,99,235; --accent-rgb:6,182,212;
  --focus-ring: 0 0 0 3px rgba(6,182,212,.4);
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --text-scale:1;
  /* validated categorical chart palette (dataviz skill reference instance) */
  --cat-1:#2a78d6; --cat-1-rgb:42,120,214;  --cat-2:#eb6834; --cat-2-rgb:235,104,52;
  --cat-3:#1baf7a; --cat-3-rgb:27,175,122;  --cat-4:#eda100; --cat-4-rgb:237,161,0;
  --cat-5:#e87ba4; --cat-5-rgb:232,123,164; --cat-6:#008300; --cat-6-rgb:0,131,0;
  --cat-7:#4a3aa7; --cat-7-rgb:74,58,167;   --cat-8:#e34948; --cat-8-rgb:227,73,72;
}
:root[data-mode="dark"]{
  --bg:#0D0C16; --bg-2:#151425; --card:#1A1829; --card-soft:#201E31;
  --text:#F5F4FC; --text-muted:#A8A4BE;
  --border:#2D2B42;
  --positive:#4ADE80; --warning:#FBBF24; --danger:#F87171;
  --neutral:#9A96A8; --neutral-rgb:154,150,168;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 10px 26px -6px rgba(0,0,0,.45);
  --shadow-lg:0 24px 56px -12px rgba(0,0,0,.6);
  --cat-1:#3987e5; --cat-1-rgb:57,135,229;  --cat-2:#d95926; --cat-2-rgb:217,89,38;
  --cat-3:#199e70; --cat-3-rgb:25,158,112;  --cat-4:#c98500; --cat-4-rgb:201,133,0;
  --cat-5:#d55181; --cat-5-rgb:213,81,129;  --cat-6:#008300; --cat-6-rgb:0,131,0;
  --cat-7:#9085e9; --cat-7-rgb:144,133,233; --cat-8:#e66767; --cat-8-rgb:230,103,103;
}
@media (prefers-color-scheme: dark){
  :root:not([data-mode="light"]):not([data-mode="dark"]){
    --bg:#0D0C16; --bg-2:#151425; --card:#1A1829; --card-soft:#201E31;
    --text:#F5F4FC; --text-muted:#A8A4BE;
    --border:#2D2B42;
    --positive:#4ADE80; --warning:#FBBF24; --danger:#F87171;
    --neutral:#9A96A8; --neutral-rgb:154,150,168;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 10px 26px -6px rgba(0,0,0,.45);
    --shadow-lg:0 24px 56px -12px rgba(0,0,0,.6);
    --cat-1:#3987e5; --cat-1-rgb:57,135,229;  --cat-2:#d95926; --cat-2-rgb:217,89,38;
    --cat-3:#199e70; --cat-3-rgb:25,158,112;  --cat-4:#c98500; --cat-4-rgb:201,133,0;
    --cat-5:#d55181; --cat-5-rgb:213,81,129;  --cat-6:#008300; --cat-6-rgb:0,131,0;
    --cat-7:#9085e9; --cat-7-rgb:144,133,233; --cat-8:#e66767; --cat-8-rgb:230,103,103;
  }
}
[data-theme="aurora"]{ --brand:#7C3AED; --accent:#DB2777; --brand-rgb:124,58,237; --accent-rgb:219,39,119;}
[data-theme="ocean"]{  --brand:#2563EB; --accent:#06B6D4; --brand-rgb:37,99,235;  --accent-rgb:6,182,212;}
[data-theme="sunset"]{ --brand:#EA580C; --accent:#DC2626; --brand-rgb:234,88,12;  --accent-rgb:220,38,38;}
[data-theme="forest"]{ --brand:#059669; --accent:#84CC16; --brand-rgb:5,150,105;  --accent-rgb:132,204,22;}
[data-theme="berry"]{  --brand:#BE185D; --accent:#9333EA; --brand-rgb:190,24,93;  --accent-rgb:147,51,234;}
[data-theme="citrus"]{ --brand:#D97706; --accent:#FACC15; --brand-rgb:217,119,6;  --accent-rgb:250,204,21;}
[data-theme="lagoon"]{ --brand:#0D9488; --accent:#3B82F6; --brand-rgb:13,148,136; --accent-rgb:59,130,246;}
[data-theme="grape"]{  --brand:#6D28D9; --accent:#4F46E5; --brand-rgb:109,40,217; --accent-rgb:79,70,229;}
[data-theme="flame"]{  --brand:#DC2626; --accent:#F97316; --brand-rgb:220,38,38;  --accent-rgb:249,115,22;}
[data-theme="mint"]{   --brand:#10B981; --accent:#0EA5E9; --brand-rgb:16,185,129; --accent-rgb:14,165,233;}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-ui);
  font-size:calc(15px*var(--text-scale)); line-height:1.5; -webkit-font-smoothing:antialiased;
  position:relative; overflow-x:hidden;
}
body::before, body::after{
  content:""; position:fixed; width:560px; height:560px; border-radius:50%;
  filter:blur(100px); z-index:0; pointer-events:none; opacity:.20;
  transition:background .3s ease;
}
body::before{ background:var(--brand); top:-200px; left:-160px; }
body::after{ background:var(--accent); bottom:-220px; right:-160px; opacity:.16; }
:root[data-mode="dark"] body::before, :root[data-mode="dark"] body::after{ opacity:.30; }
body.cb-safe .danger-fill{fill:url(#pat-danger);}
body.cb-safe .warning-fill{fill:url(#pat-warning);}
h1,h2,h3{font-family:var(--font-display); margin:0 0 4px; font-weight:500; letter-spacing:-.01em;}
button{font-family:inherit; cursor:pointer; color:inherit;}
a{color:inherit;}
.hide-amounts .money{ filter:blur(6px); transition:filter .15s; user-select:none; }
.hide-amounts .money:hover{ filter:blur(0); }

/* ===================== DEMO BANNER / BADGE ===================== */
#demo-top-banner{
  position:sticky; top:0; z-index:50; height:40px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(118deg,#1B2433 0%,#1F2C40 55%,#233349 100%); color:#fff;
  font-size:13px; font-weight:600; letter-spacing:.01em; padding:0 16px; text-align:center;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}
#demo-top-banner b{font-weight:800;}
@media (max-width:620px){ #demo-top-banner{font-size:11.5px; height:36px;} }

/* ===================== LAYOUT SHELL ===================== */
#shell{display:grid; grid-template-columns:230px 1fr; min-height:calc(100vh - 40px); position:relative; z-index:1;}
@media (max-width:860px){ #shell{grid-template-columns:1fr;} }

#sidebar{
  background:var(--card); border-right:1px solid var(--border); padding:20px 14px;
  display:flex; flex-direction:column; gap:4px; position:sticky; top:40px; height:calc(100vh - 40px); overflow:auto;
}
@media (max-width:860px){ #sidebar{display:none;} }
.brandmark{display:flex; align-items:center; padding:8px 10px 20px;}
.brandmark svg{width:132px; height:auto; display:block;}
.navgroup{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin:14px 10px 6px;}
.navitem{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-ctl);
  color:var(--text); text-decoration:none; font-size:14px; border:none; background:transparent; width:100%; text-align:left;
  position:relative; transition:background .15s ease, color .15s ease, transform .15s ease;
}
.navitem:hover{background:var(--bg-2); transform:translateX(2px);}
.navitem.active{background:linear-gradient(120deg, rgba(var(--brand-rgb),.14), rgba(var(--accent-rgb),.10)); color:var(--brand); font-weight:700;}
.navitem.active::before{content:"";position:absolute; left:-14px; top:8px; bottom:8px; width:4px; border-radius:0 6px 6px 0; background:linear-gradient(var(--brand),var(--accent));}
.navitem .ic{width:18px; text-align:center;}

#topbar{
  display:flex; align-items:center; gap:10px; padding:14px 22px; border-bottom:1px solid var(--border);
  background:var(--card); position:sticky; top:40px; z-index:20;
}
@media (max-width:620px){ #topbar{top:36px;} }
#topbar .spacer{flex:1;}
.iconbtn{
  background:var(--bg-2); border:1px solid var(--border); border-radius:10px; width:38px; height:38px;
  display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text);
  transition:transform .12s ease, background .12s ease;
}
.iconbtn:hover{ background:rgba(var(--brand-rgb),.14); transform:translateY(-1px); }
.btn{
  border:1px solid var(--border); background:var(--bg-2); color:var(--text); border-radius:var(--radius-ctl);
  padding:9px 14px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease; box-shadow:var(--shadow-sm);
}
.btn:hover{ filter:brightness(1.05); box-shadow:var(--shadow-md); transform:translateY(-1px); }
.btn:active{ transform:translateY(0) scale(.97); }
.btn.primary{background:linear-gradient(135deg, var(--accent), var(--brand)); color:#fff; border-color:transparent; box-shadow:0 8px 20px -6px rgba(var(--accent-rgb),.55);}
.btn.brand{background:linear-gradient(135deg, var(--brand), var(--accent)); color:#fff; border-color:transparent; box-shadow:0 8px 20px -6px rgba(var(--brand-rgb),.55);}
.btn.ghost{background:transparent; box-shadow:none;}
.btn.small{padding:6px 10px; font-size:12.5px;}
.btn:focus-visible, .navitem:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible{outline:none; box-shadow:var(--focus-ring);}
.pill-toggle{display:flex; background:var(--bg-2); border-radius:999px; padding:3px; gap:2px; border:1px solid var(--border);}
.pill-toggle button{border:none; background:transparent; padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--text-muted); transition:background .15s, color .15s;}
.pill-toggle button.active{background:linear-gradient(135deg,var(--brand),var(--accent)); color:#fff; box-shadow:0 4px 12px -2px rgba(var(--brand-rgb),.5);}

#main{padding:22px 24px 90px; max-width:1180px;}
@media (max-width:860px){ #main{padding:16px 14px 90px;} }
.overline{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:2px;}
.screen-title{font-size:26px; margin-bottom:16px;}
.grid-23{display:grid; grid-template-columns:2fr 1fr; gap:18px;}
@media (max-width:860px){ .grid-23{grid-template-columns:1fr;} }
.row{display:flex; gap:14px; flex-wrap:wrap;}
.col{display:flex; flex-direction:column; gap:14px;}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px 20px;
  box-shadow:var(--shadow-sm); transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
.card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:rgba(var(--brand-rgb),.3); }
.card.soft{background:var(--card-soft);}
.card h3{font-size:15px;}
.card .sub{color:var(--text-muted); font-size:13px; margin-bottom:10px;}

.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
@media (max-width:620px){ .kpis{grid-template-columns:1fr 1fr;} }
.kpi{background:var(--card); border:1px solid var(--border); border-left:3px solid var(--brand); border-radius:16px; padding:13px 14px;
  box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .15s ease;}
.kpi:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.kpi:has(.value.pos){ border-left-color:var(--positive-vivid); }
.kpi:has(.value.neg){ border-left-color:var(--danger-vivid); }
.kpi .label{font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;}
.kpi .value{font-size:19px; font-weight:700; margin-top:3px;}
.kpi .value.pos{color:var(--positive);} .kpi .value.neg{color:var(--danger);}

.hero{background:linear-gradient(135deg, var(--brand), var(--accent)); color:#fff; border-radius:24px; padding:26px 24px; position:relative; overflow:hidden; box-shadow:var(--shadow-lg);}
.hero::before{content:"";position:absolute; width:280px;height:280px;border-radius:50%; background:rgba(255,255,255,.14); top:-90px; right:-70px;}
.hero::after{content:"";position:absolute; width:190px;height:190px;border-radius:50%; background:rgba(255,255,255,.10); bottom:-80px; right:90px;}
.hero > *{position:relative; z-index:1;}
.hero .overline{color:rgba(255,255,255,.85);}
.hero .amount{font-family:var(--font-display); font-size:46px; font-weight:500; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin:4px 0 2px; transition:none;}
.hero .amount sup{font-size:22px; top:-18px;}
.hero .sentence{opacity:.95; font-size:14px; max-width:420px;}
.hero .row{margin-top:16px;}
.hero .btn{background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.3); box-shadow:none;}
.hero .btn:hover{background:rgba(255,255,255,.28);}
.hero .btn.primary{background:#fff; color:var(--brand); box-shadow:0 8px 20px -4px rgba(0,0,0,.25);}
.freshness{display:inline-flex; align-items:center; gap:6px; font-size:12px; background:rgba(255,255,255,.18); padding:5px 10px; border-radius:999px; backdrop-filter:blur(6px);}
.freshness.fuzzy{background:rgba(255,210,120,.3);}

.chip{border:1px solid var(--border); background:var(--bg-2); border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; transition:transform .12s ease, box-shadow .12s ease, background .12s ease;}
.chip:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm);}
.chip.active{background:linear-gradient(135deg, var(--accent), var(--brand)); color:#fff; border-color:transparent; box-shadow:0 6px 16px -4px rgba(var(--accent-rgb),.5);}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}

input,select,textarea{
  font-family:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-ctl);
  background:var(--card); color:var(--text); width:100%;
}
label{font-size:12.5px; color:var(--text-muted); display:block; margin-bottom:4px;}
.field{margin-bottom:12px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}

.list-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); transition:background .12s ease;}
.list-row:last-child{border-bottom:none;}
.list-row:hover{background:var(--bg-2); margin:0 -10px; padding-left:10px; padding-right:10px; border-radius:10px;}
.list-row .emoji{font-size:17px; width:32px; height:32px; line-height:32px; text-align:center; border-radius:10px; background:var(--bg-2); flex-shrink:0;}
.list-row .meta{flex:1; min-width:0;}
.list-row .meta .t{font-weight:600; font-size:14px;}
.list-row .meta .d{font-size:12.5px; color:var(--text-muted);}
.list-row .amt{font-weight:700; font-size:14.5px; white-space:nowrap;}
.list-row .amt.out{color:var(--text);} .list-row .amt.in{color:var(--positive);}
.list-row .iconbtn{width:30px;height:30px;font-size:13px;}

table.datatable{width:100%; border-collapse:collapse; font-size:13px;}
table.datatable th, table.datatable td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--border);}
table.datatable th{color:var(--text-muted); font-weight:600; font-size:11.5px; text-transform:uppercase;}
.table-wrap{overflow-x:auto;}

.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
.chart-caption{font-size:13px; color:var(--text-muted); margin-top:8px;}
.chart-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
svg text{font-family:var(--font-ui); fill:var(--text);}
.axis-label{font-size:10.5px; fill:var(--text-muted);}
.gridline{stroke:var(--border); stroke-width:1;}
.chart-view svg{ cursor:crosshair; }
.hover-crosshair{stroke:var(--text-muted); stroke-width:1; stroke-dasharray:3 3; pointer-events:none;}
.hover-dot{fill:var(--accent); stroke:var(--card); stroke-width:2.5; pointer-events:none;}
.chart-tooltip{position:fixed; z-index:500; background:var(--text); color:var(--bg); padding:7px 11px; border-radius:10px;
  font-size:12px; pointer-events:none; display:none; box-shadow:var(--shadow-lg); transform:translateY(-100%);}
.chart-tooltip b{display:block;font-size:13.5px; font-weight:700;}
.chart-tooltip span{opacity:.72;font-size:11px;}

.badge{font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px;}
.badge.pos{background:rgba(var(--positive-rgb),.15); color:var(--positive);}
.badge.neg{background:rgba(var(--danger-rgb),.15); color:var(--danger);}
.badge.warn{background:rgba(var(--warning-rgb),.18); color:var(--warning);}
.badge.neu{background:var(--bg-2); color:var(--text-muted);}

#tabbar{display:none; position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--border); z-index:30;}
@media (max-width:860px){ #tabbar{display:flex;} }
#tabbar button{flex:1; border:none; background:transparent; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0 10px; font-size:10.5px; color:var(--text-muted);}
#tabbar button.active{color:var(--brand); font-weight:700;}
#tabbar .ic{font-size:18px;}
#tabbar .fab{background:linear-gradient(135deg,var(--accent),var(--brand)); color:#fff; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; margin:-20px auto 0; box-shadow:0 8px 20px -4px rgba(var(--accent-rgb),.6);}

.sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; justify-content:center; z-index:100;}
@media (min-width:620px){ .sheet-overlay{align-items:center;} }
.sheet{background:var(--card); border-radius:22px 22px 0 0; width:100%; max-width:480px; max-height:92vh; overflow:auto; padding:20px 20px 28px;}
@media (min-width:620px){ .sheet{border-radius:22px;} }
.sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.numpad{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:12px 0;}
.numpad button{padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--bg-2); font-size:17px; font-weight:600;}
.bigamount{font-size:38px; font-weight:500; letter-spacing:-.02em; font-variant-numeric:tabular-nums; text-align:center; font-family:var(--font-display); padding:10px 0;}

#cmdk-overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding-top:11vh;}
#cmdk{background:var(--card); border-radius:16px; width:92%; max-width:520px; padding:10px; box-shadow:0 20px 50px rgba(0,0,0,.25);}
#cmdk input{border:none; font-size:17px; padding:12px;}
#cmdk .res{padding:9px 12px; border-radius:10px; font-size:14px;}
#cmdk .res:hover, #cmdk .res.sel{background:var(--bg-2);}

.toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:12px; font-size:13.5px; z-index:300; display:flex; gap:12px; align-items:center; box-shadow:var(--shadow-lg); animation:toastin .25s ease;}
.toast button{background:none; border:none; color:var(--accent); font-weight:700; font-size:13px;}
@keyframes toastin{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }

.themepick{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
.themepick .sw{height:44px; border-radius:12px; cursor:pointer; border:2px solid transparent; position:relative; transition:transform .12s ease, box-shadow .12s ease;}
.themepick .sw:hover{transform:translateY(-2px) scale(1.04); box-shadow:var(--shadow-md);}
.themepick .sw.active{border-color:var(--text); box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--text);}
.themepick .sw.active::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.5);}
.carousel{display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x mandatory;}
.carousel .cardslide{min-width:230px; scroll-snap-align:start;}
.heatgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.heatcell{aspect-ratio:1; border-radius:5px;}

.draw-lively{ animation: drawin .9s ease-out; }
.draw-calm{ animation: drawin 1.8s ease-in-out; }
@keyframes drawin{ from{opacity:0;} to{opacity:1;} }
@media (prefers-reduced-motion: reduce){ .draw-lively, .draw-calm{ animation:none !important; } }

@media print{
  #sidebar, #topbar, #tabbar, .toggle-view-btn, .btn, .numpad, .sheet-overlay, .freshness, #demo-top-banner{ display:none !important; }
  #main{ padding:0; max-width:100%; }
  body{ background:#fff; color:#000; }
  .card{ break-inside:avoid; border-color:#ccc; }
  @page{ size:A4; margin:14mm; }
}
</style>

function t(key){ const d=I18N[state.settings.locale]||I18N.en; return d[key] !== undefined ? d[key] : (I18N.en[key]!==undefined?I18N.en[key]:key); }

const LOCALE_MAP = {en:'en-US', fr:'fr-FR', de:'de-DE', es:'es-ES', it:'it-IT'};
function fmtMoney(minor, opts){
  opts = opts||{};
  const cur = state.settings.currency;
  const loc = LOCALE_MAP[state.settings.locale] || 'en-US';
  const sign = minor < 0 ? '-' : '';
  const abs = Math.abs(minor);
  const style = state.settings.numberStyle;
  const whole = Math.floor(abs/100), cents = abs%100;
  const wholeStr = new Intl.NumberFormat(loc).format(whole);
  if(style==='elegant' || style==='ledger'){
    return `<span class="money">${sign}${new Intl.NumberFormat(loc,{style:'currency',currency:cur}).format(abs/100)}</span>`;
  }
  const curSymbol = (0).toLocaleString(loc,{style:'currency',currency:cur,minimumFractionDigits:0,maximumFractionDigits:0}).replace(/\d/g,'').trim();
  const sepDec = (1.1).toLocaleString(loc).charAt(1);
  if(opts.big){
    return `<span class="money">${sign}${curSymbol}${wholeStr}<sup>${sepDec}${String(cents).padStart(2,'0')}</sup></span>`;
  }
  return `<span class="money">${new Intl.NumberFormat(loc,{style:'currency',currency:cur}).format(sign==='-'?-abs/100:abs/100)}</span>`;
}
function fmtDate(d, opts){
  const loc = LOCALE_MAP[state.settings.locale] || 'en-US';
  return new Intl.DateTimeFormat(loc, opts||{day:'numeric',month:'short'}).format(new Date(d));
}
function fmtDateLong(d){ const loc = LOCALE_MAP[state.settings.locale]||'en-US'; return new Intl.DateTimeFormat(loc,{day:'numeric',month:'long',year:'numeric'}).format(new Date(d)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function addMonths(iso,n){ const d=new Date(iso+'T00:00:00'); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function migrateState(raw){
  if(!raw.version) raw.version = 1;
  if(!raw.settings) raw.settings = defaultSettings();
  else raw.settings = Object.assign(defaultSettings(), raw.settings);
  if(raw.settings.theme && LEGACY_THEME_MAP[raw.settings.theme] && !['aurora','ocean','sunset','forest','berry','citrus','lagoon','grape','flame','mint'].includes(raw.settings.theme)){

   'netWorthSnapshots','importRules','dailyCheckIns','usuals'].forEach(k=>{ if(!raw[k]) raw[k]=[]; });

  if(!raw.demoTrialStart) raw.demoTrialStart = todayISO();
  return raw;
}

  let s = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) s = migrateState(JSON.parse(raw));
  }catch(e){ console.warn('state load failed', e); }
  if(!s) s = seedDemoState();
  if(daysBetween(s.demoTrialStart, todayISO()) >= DEMO_TRIAL_DAYS){

    DEMO_JUST_RESET = true;

  return s;
}

/* ===================== CALCULATION ENGINE ===================== */
function getNextOccurrence(repeat, fromISO){
  const sch = repeat.schedule;
  let d = sch.anchorDate;
  const stepDays = {weekly:7, biweekly:14}[sch.freq];
  if(stepDays){
    while(d < fromISO) d = addDays(d, stepDays);
    return d;
  }
  if(sch.freq==='monthly' || sch.freq==='everyNMonths' || sch.freq==='yearly'){
    const step = sch.freq==='yearly'?12:(sch.interval||1);
    let day = new Date(sch.anchorDate+'T00:00:00').getDate();
    let cur = sch.anchorDate;
    let guard=0;
    while(cur < fromISO && guard<2000){ cur = addMonths(cur, step); guard++; }
    return cur;
  }
  return sch.anchorDate; // once / custom
}
function nextOccurrencesInRange(repeat, fromISO, toISO){
  const out = [];
  let d = getNextOccurrence(repeat, fromISO);
  let guard=0;
  const stepDays = {weekly:7, biweekly:14}[repeat.schedule.freq];
  const monthStep = repeat.schedule.freq==='yearly'?12:(repeat.schedule.interval||1);
  while(d<=toISO && guard<1000){
    if(repeat.endDate && d>repeat.endDate) break;
    out.push(d);
    if(repeat.schedule.freq==='once' || repeat.schedule.freq==='custom') break;
    d = stepDays ? addDays(d,stepDays) : addMonths(d, (repeat.schedule.freq==='everyNMonths'||repeat.schedule.freq==='monthly')?(repeat.schedule.interval||1):12);
    guard++;
  }
  return out;
}
function getNextPayday(){
  const incomeRepeats = state.repeats.filter(r=>r.kind==='income' && !r.paused);
  let best = null;
  incomeRepeats.forEach(r=>{ const d = getNextOccurrence(r, todayISO()); if(!best || d<best) best=d; });
  return best || addMonths(todayISO(),1);
}
function activeRepeats(kinds){ return state.repeats.filter(r=>!r.paused && kinds.includes(r.kind)); }

function computeSafeToSpend(){
  const nextPayday = getNextPayday();
  const countedBalance = state.accounts.filter(a=>a.countsTowardSafe).reduce((s,a)=>s+a.balanceMinor,0);
  let dueBills = 0;
  activeRepeats(['bill','subscription','debtPayment']).forEach(r=>{
    nextOccurrencesInRange(r, todayISO(), nextPayday).forEach(()=>{ dueBills += r.estimatedAmountMinor; });
  });
  const goalKeepOut = state.goals.filter(g=>g.keptOut).reduce((s,g)=>s+g.monthlyContributionMinor,0);
  const buffer = state.settings.bufferMinor;
  const safeUntilPayday = countedBalance - dueBills - goalKeepOut - buffer;
  const daysLeft = Math.max(1, daysBetween(todayISO(), nextPayday));
  const safeToday = Math.floor(safeUntilPayday / daysLeft);
  return {countedBalance, dueBills, goalKeepOut, buffer, safeUntilPayday, daysLeft, safeToday, nextPayday};
}
function avgDailySpend(days){
  days = days||30;
  const from = addDays(todayISO(),-days);
  const spent = state.transactions.filter(tx=>tx.direction==='out' && tx.date>=from).reduce((s,tx)=>s+tx.amountMinor,0);
  return spent/days;
}
function computeForecast(horizonDays, whatIf){
  const safe = computeSafeToSpend();
  let balance = safe.countedBalance;
  const start = todayISO();
  const points = [{date:start, balance}];
  const avgSpend = avgDailySpend(30) || safe.safeToday;
  for(let i=1;i<=horizonDays;i++){
    const d = addDays(start,i);
    const assumed = d<=safe.nextPayday ? Math.max(0,safe.safeToday) : avgSpend;
    balance -= assumed;
    let dueToday = 0, incomeToday = 0;
    state.repeats.filter(r=>!r.paused).forEach(r=>{
      nextOccurrencesInRange(r, d, d).forEach(()=>{
        if(r.kind==='income') incomeToday += r.estimatedAmountMinor;
        else dueToday += r.estimatedAmountMinor;
      });
    });
    balance -= dueToday; balance += incomeToday;
    if(whatIf && d===whatIf.date) balance -= whatIf.amountMinor;
    points.push({date:d, balance, event: dueToday?'due':(incomeToday?'income':null)});
  }
  let lowest = points[0];
  points.forEach(p=>{ if(p.balance<lowest.balance) lowest=p; });
  const protectedThreshold = safe.buffer + safe.goalKeepOut;
  return {points, lowest, protectedThreshold, gap: lowest.balance - protectedThreshold};
}
function simulateDebtPayoff(strategy, extraMinor){
  extraMinor = extraMinor||0;
  let debts = state.debts.map(d=>({...d}));
  if(strategy==='avalanche') debts.sort((a,b)=>b.apr-a.apr);
  else if(strategy==='snowball') debts.sort((a,b)=>a.balanceMinor-b.balanceMinor);
  else debts.sort((a,b)=>a.order-b.order);
  let months=0, totalInterest=0;
  const trail=[];
  let extraPool = extraMinor;
  while(debts.some(d=>d.balanceMinor>0) && months<600){
    months++;
    let freedUp = 0;
    debts.forEach(d=>{
      if(d.balanceMinor<=0) return;
      const interest = Math.round(d.balanceMinor * (d.apr/100/12));
      totalInterest += interest;
      d.balanceMinor += interest;
    });
    let pool = extraPool;
    for(const d of debts){
      if(d.balanceMinor<=0) continue;
      let pay = d.minPaymentMinor;
      if(pool>0 && d===debts.find(x=>x.balanceMinor>0)){ pay += pool; pool=0; }
      pay = Math.min(pay, d.balanceMinor);
      d.balanceMinor -= pay;
      if(d.balanceMinor<=0) freedUp += d.minPaymentMinor;
    }
    extraPool += 0;
    trail.push({month:months, total:debts.reduce((s,d)=>s+Math.max(0,d.balanceMinor),0)});
  }
  const payoffDate = addMonths(todayISO(), months);
  return {months, totalInterest, payoffDate, trail};
}
function minimumsOnlyTrail(){
  let debts = state.debts.map(d=>({...d}));
  let months=0; const trail=[];
  while(debts.some(d=>d.balanceMinor>0) && months<600){
    months++;
    debts.forEach(d=>{
      if(d.balanceMinor<=0) return;
      const interest = Math.round(d.balanceMinor*(d.apr/100/12));
      d.balanceMinor += interest;
      d.balanceMinor -= Math.min(d.minPaymentMinor, d.balanceMinor);
    });
    trail.push({month:months, total:debts.reduce((s,d)=>s+Math.max(0,d.balanceMinor),0)});
  }
  return trail;
}
function goalProjection(goal){
  const remaining = goal.targetMinor - goal.savedMinor;
  if(goal.monthlyContributionMinor<=0) return {months:Infinity, date:null};
  const months = Math.ceil(remaining/goal.monthlyContributionMinor);
  return {months, date: addMonths(todayISO(), months)};
}
function requiredMonthlyForDate(goal, targetDateISO){
  const remaining = goal.targetMinor - goal.savedMinor;
  const months = Math.max(1, Math.ceil(daysBetween(todayISO(), targetDateISO)/30.44));
  return Math.ceil(remaining/months);
}
function safetyNetMonths(){
  const avgMonthlySpend = avgDailySpend(180)*30.44;
  const savings = state.accounts.filter(a=>!a.countsTowardSafe).reduce((s,a)=>s+a.balanceMinor,0);
  return avgMonthlySpend>0 ? savings/avgMonthlySpend : 0;
}
function yearMonthlyProvision(){
  const T = todayISO();
  let total = 0;
  activeRepeats(['bill','subscription','debtPayment']).forEach(r=>{
    if(['weekly','biweekly','monthly'].includes(r.schedule.freq)) return;
    nextOccurrencesInRange(r, T, addDays(T,365)).forEach(()=>{ total += r.estimatedAmountMinor; });
  });
  return total/12;
}
function netWorthNow(){
  const accounts = state.accounts.reduce((s,a)=>s+a.balanceMinor,0);
  const assets = state.assets.reduce((s,a)=>s+a.valueMinor,0);
  const debts = state.debts.reduce((s,d)=>s+d.balanceMinor,0);
  const liabilities = state.liabilities.reduce((s,l)=>s+l.valueMinor,0);
  return {own: accounts+assets, owe: debts+liabilities, net: accounts+assets-debts-liabilities};
}
function moneyHealthScore(){
  const income = state.repeats.filter(r=>r.kind==='income').reduce((s,r)=>s+r.estimatedAmountMinor,0) || 1;
  const monthlySpend = avgDailySpend(60)*30.44;
  const savingsRate = clamp((income-monthlySpend)/income,0,1);
  const cashflow = Math.round(clamp(savingsRate/0.2,0,1)*20);
  const netMonths = safetyNetMonths();
  const cushion = Math.round(clamp(netMonths/3,0,1)*20);
  const debtMonthly = state.debts.reduce((s,d)=>s+d.minPaymentMinor,0);
  const debtRatio = debtMonthly/income;
  const debtLoad = Math.round(clamp(1-(debtRatio/0.10),0,1)*20);
  const last30 = state.dailyCheckIns.filter(c=>c.date>=addDays(todayISO(),-30));
  const billsPct = last30.length ? last30.filter(c=>c.billsTicked).length/last30.length : 0.5;
  const billsTicked = Math.round(billsPct*20);
  const keptPct = last30.length ? last30.filter(c=>c.checkedBalance||c.loggedSpending).length/Math.min(30,last30.length||1) : 0.5;
  const keptUp = Math.round(clamp(keptPct,0,1)*20);
  const total = cashflow+cushion+debtLoad+billsTicked+keptUp;
  return {total, cashflow, cushion, debtLoad, billsTicked, keptUp, savingsRate, netMonths, debtRatio};
}

function nextChartId(prefix){ return prefix+'_'+(CHART_SEQ++); }
function scaleLin(d0,d1,r0,r1){ const span=(d1-d0)||1; return v => r0 + (v-d0)/span*(r1-r0); }
function animClass(){ return state.settings.animations==='off' ? '' : (state.settings.animations==='calm' ? 'draw-calm' : 'draw-lively'); }
function colorVar(name){ return 'var(--'+name+')'; }

/* ---------- Area / sparkline chart (Next 30 days, Balance forecast) ---------- */
function areaChart(points, opts){
  opts = opts||{};
  const w = opts.width||560, h = opts.height||200, pad = {l:opts.padL!=null?opts.padL:44,r:14,t:16,b:26};
  const vals = points.map(p=>p.balance!=null?p.balance:p.v);
  let min = Math.min(...vals, opts.threshold!=null?opts.threshold:vals[0]);
  let max = Math.max(...vals, opts.threshold!=null?opts.threshold:vals[0]);
  if(min===max){ min-=100; max+=100; }
  const pb = (max-min)*0.08; min-=pb; max+=pb;
  const x = scaleLin(0, points.length-1, pad.l, w-pad.r);
  const y = scaleLin(min, max, h-pad.b, pad.t);
  const id = nextChartId('area');
  let d = points.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.balance!=null?p.balance:p.v).toFixed(1)}`).join(' ');
  let area = d + ` L${x(points.length-1).toFixed(1)},${y(min).toFixed(1)} L${x(0).toFixed(1)},${y(min).toFixed(1)} Z`;
  const gridY = [min + (max-min)*0.25, min+(max-min)*0.5, min+(max-min)*0.75];
  let gridHtml = gridY.map(gv=>`<line class="gridline" x1="${pad.l}" x2="${w-pad.r}" y1="${y(gv).toFixed(1)}" y2="${y(gv).toFixed(1)}"/>`).join('');
  let thresholdHtml='';
  if(opts.threshold!=null){
    thresholdHtml = `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(opts.threshold).toFixed(1)}" y2="${y(opts.threshold).toFixed(1)}" stroke="var(--danger)" stroke-width="1.4" stroke-dasharray="4 4"/>`;
  }
  let whatIfHtml='';
  if(opts.whatIfPoints){
    const wd = opts.whatIfPoints.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.balance).toFixed(1)}`).join(' ');
    whatIfHtml = `<path d="${wd}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>`;
  }
  let dots='';
  points.forEach((p,i)=>{
    if(p.event){
      dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.balance).toFixed(1)}" r="3.4" fill="${p.event==='income'?'var(--positive)':'var(--accent)'}"><title>${esc(fmtDate(p.date))}</title></circle>`;
    }
  });
  let lowestDot = '';
  if(opts.lowest){
    const li = points.findIndex(p=>p.date===opts.lowest.date);
    if(li>=0) lowestDot = `<circle cx="${x(li).toFixed(1)}" cy="${y(opts.lowest.balance).toFixed(1)}" r="4.5" fill="var(--danger)" stroke="var(--card)" stroke-width="2"/>`;
  }
  const xTicks = opts.xTicks || [0, Math.floor(points.length/2), points.length-1];
  let xLabels = xTicks.map(i=>`<text class="axis-label" x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(fmtDate(points[i].date))}</text>`).join('');
  const gradId = id+'-g';
  const lineId = id+'-l';
  const inner = `<defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity=".40"/><stop offset="100%" stop-color="var(--brand)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="${lineId}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="var(--brand)"/><stop offset="100%" stop-color="var(--accent)"/>
      </linearGradient>
    </defs>
    ${gridHtml}${thresholdHtml}
    <path d="${area}" fill="url(#${gradId})" class="${animClass()}"/>
    <path d="${d}" fill="none" stroke="url(#${lineId})" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="${animClass()}"/>
    ${whatIfHtml}${dots}${lowestDot}${xLabels}`;
  CHART_HOVER[id] = {
    hoverPoints: points.map((p,i)=>({px:x(i), py:y(p.balance!=null?p.balance:p.v), label:fmtDate(p.date), value:fmtMoney(p.balance!=null?p.balance:p.v).replace(/<[^>]+>/g,'')})),
    top:pad.t, bottom:h-pad.b, w, h
  };
  return svgShell(id, w, h, opts.title||'Chart', opts.desc||'', inner);
}

  const xLabels = xTicks.map(i=>`<text class="axis-label" x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(points[i].label)}</text>`).join('');
  const inner = `<defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--brand)" stop-opacity=".35"/><stop offset="100%" stop-color="var(--brand)" stop-opacity="0"/></linearGradient>
      <linearGradient id="${lineId}" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="var(--brand)"/><stop offset="100%" stop-color="var(--accent)"/></linearGradient>

    top:pad.t, bottom:h-pad.b, w, h
  };
  return svgShell(id,w,h,t('trend_12mo'),'',inner);
}

/* ---------- Waterfall chart ---------- */
function waterfallChart(steps){
  // steps: [{label, value, type: 'start'|'add'|'sub'|'end'}]
  const w=600,h=230,pad={l:14,r:14,t:20,b:36};
  let running=0; const bars=[];
  steps.forEach(s=>{
    if(s.type==='start'||s.type==='end'){ bars.push({label:s.label, from:0, to:s.value, type:s.type}); running=s.value; }
    else { const from=running; running += (s.type==='sub'?-s.value:s.value); bars.push({label:s.label, from:Math.min(from,running), to:Math.max(from,running), type:s.type}); }
  });
  const maxV = Math.max(...bars.map(b=>b.to), 1);
  const bw=(w-pad.l-pad.r)/bars.length;
  const y = scaleLin(0,maxV,h-pad.b,pad.t);
  const id=nextChartId('wf');
  let rects='', connectors='';
  bars.forEach((b,i)=>{
    const x0=pad.l+i*bw+bw*0.15, bw2=bw*0.7;
    const color = b.type==='start'||b.type==='end' ? 'var(--brand)' : (b.type==='sub'?'var(--danger)':'var(--positive)');
    rects += `<rect x="${x0.toFixed(1)}" y="${y(b.to).toFixed(1)}" width="${bw2.toFixed(1)}" height="${(y(b.from)-y(b.to)).toFixed(1)}" fill="${color}" rx="3" class="${animClass()}"/>`;
    rects += `<text class="axis-label" x="${(x0+bw2/2).toFixed(1)}" y="${h-18}" text-anchor="middle">${esc(b.label)}</text>`;
    rects += `<text x="${(x0+bw2/2).toFixed(1)}" y="${(y(b.to)-6).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600">${esc(fmtMoney(b.to-b.from,{}).replace(/<[^>]+>/g,''))}</text>`;
  });
  return svgShell(id,w,h,t('how_month_added_up'),'',rects);
}

/* ---------- Sankey-like flow (simplified bezier bands) ---------- */
function sankeyChart(leftNodes, rightNodes, flows){
  // leftNodes:[{id,label,value}], rightNodes same, flows:[{from,to,value}]
  const w=620,h=280, colW=150;
  const totalL = leftNodes.reduce((s,n)=>s+n.value,0)||1;
  const totalR = rightNodes.reduce((s,n)=>s+n.value,0)||1;
  const pad=20, usableH=h-pad*2;
  let yl=pad, yr=pad;
  const lPos={}, rPos={};
  leftNodes.forEach(n=>{ const hgt=usableH*(n.value/totalL); lPos[n.id]={y:yl,h:hgt}; yl+=hgt; });
  rightNodes.forEach(n=>{ const hgt=usableH*(n.value/totalR); rPos[n.id]={y:yr,h:hgt}; yr+=hgt; });
  const x0=70, x1=w-colW-20+colW*0; const xLeft=90, xRight=w-90;
  let bands='', used={};
  const palette=CAT_SLOTS;
  flows.forEach((f,i)=>{
    const lp = lPos[f.from], rp = rPos[f.to];
    used[f.from]=used[f.from]||0; used[f.to]=used[f.to]||0;
    const ly0 = lp.y+used[f.from], ry0 = rp.y+used[f.to];
    const bandH = usableH*(f.value/totalL);
    used[f.from]+=bandH; used[f.to]+=bandH;
    const color = `var(--${palette[i%palette.length]})`;
    bands += `<path d="M${xLeft},${ly0} C${(xLeft+xRight)/2},${ly0} ${(xLeft+xRight)/2},${ry0} ${xRight},${ry0}
      L${xRight},${ry0+bandH} C${(xLeft+xRight)/2},${ry0+bandH} ${(xLeft+xRight)/2},${ly0+bandH} ${xLeft},${ly0+bandH} Z"
      fill="${color}" opacity="0.65" class="${animClass()}"><title>${esc(f.from)} → ${esc(f.to)}</title></path>`;
  });
  let nodesHtml='';
  leftNodes.forEach(n=>{ const p=lPos[n.id]; nodesHtml += `<rect x="${xLeft-8}" y="${p.y}" width="8" height="${p.h}" rx="3" fill="var(--brand)"/><text x="${xLeft-14}" y="${p.y+p.h/2+4}" text-anchor="end" font-size="12">${esc(n.label)}</text>`; });
  rightNodes.forEach((n,i)=>{ const p=rPos[n.id]; nodesHtml += `<rect x="${xRight}" y="${p.y}" width="8" height="${p.h}" rx="3" fill="var(--${palette[i%palette.length]})"/><text x="${xRight+14}" y="${p.y+p.h/2+4}" text-anchor="start" font-size="12">${esc(n.label)}</text>`; });
  const id=nextChartId('sankey');
  return svgShell(id,w,h,t('where_money_went'),'',bands+nodesHtml);
}

function heatmapHtml(days){

  return `<div class="heatgrid">${cells}</div>`;
}

/* ---------- chart hover: crosshair + tooltip ---------- */
function wireChartHover(){
  Object.keys(CHART_HOVER).forEach(id=>{
    const svg = document.getElementById(id);
    if(!svg) return;
    const reg = CHART_HOVER[id];
    svg.addEventListener('mousemove', (ev)=>chartHoverMove(svg, reg, ev));
    svg.addEventListener('mouseleave', ()=>chartHoverLeave(svg));
    svg.addEventListener('touchmove', (ev)=>{ if(ev.touches[0]) chartHoverMove(svg, reg, ev.touches[0]); }, {passive:true});
  });
}
function chartHoverMove(svg, reg, ev){
  const rect = svg.getBoundingClientRect();
  if(!rect.width) return;
  const scaleX = reg.w/rect.width;
  const mx = (ev.clientX-rect.left)*scaleX;
  let nearest=0, best=Infinity;
  reg.hoverPoints.forEach((p,i)=>{ const d=Math.abs(p.px-mx); if(d<best){best=d;nearest=i;} });
  const p = reg.hoverPoints[nearest];
  let g = svg.querySelector('.hover-ui');
  if(!g){
    g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','hover-ui');
    const line=document.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('class','hover-crosshair');
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle'); dot.setAttribute('r','4.5'); dot.setAttribute('class','hover-dot');
    g.appendChild(line); g.appendChild(dot); svg.appendChild(g);
  }
  const line=g.querySelector('.hover-crosshair'), dot=g.querySelector('.hover-dot');
  line.setAttribute('x1',p.px); line.setAttribute('x2',p.px); line.setAttribute('y1',reg.top); line.setAttribute('y2',reg.bottom);
  dot.setAttribute('cx',p.px); dot.setAttribute('cy',p.py);
  g.style.display='block';
  let tip = document.getElementById('chart-tooltip');
  if(!tip){ tip=document.createElement('div'); tip.id='chart-tooltip'; tip.className='chart-tooltip'; document.body.appendChild(tip); }
  tip.innerHTML = `<b>${esc(p.value)}</b><span>${esc(p.label)}</span>`;
  tip.style.left = Math.min(window.innerWidth-160, ev.clientX+14)+'px'; tip.style.top=(ev.clientY-14)+'px';
  tip.style.display='block';
}
function chartHoverLeave(svg){
  const g = svg.querySelector('.hover-ui'); if(g) g.style.display='none';
  const tip = document.getElementById('chart-tooltip'); if(tip) tip.style.display='none';
}

/* ---------- hero number count-up ---------- */
let HERO_LAST_VAL = null;
function animateHeroAmount(){
  const el = document.getElementById('hero-amount');
  if(!el) return;
  const target = parseInt(el.getAttribute('data-target'),10)||0;
  if(target===HERO_LAST_VAL) return;
  const start = HERO_LAST_VAL==null ? 0 : HERO_LAST_VAL;
  HERO_LAST_VAL = target;
  if(state.settings.animations==='off'){ el.innerHTML = fmtMoney(target,{big:true}); return; }
  const duration = state.settings.animations==='calm' ? 1100 : 650;
  const t0 = performance.now();
  function step(now){
    const p = Math.min(1, (now-t0)/duration);
    const eased = 1-Math.pow(1-p,3);
    const cur = Math.round(start + (target-start)*eased);
    el.innerHTML = fmtMoney(cur,{big:true});
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderSidebar(){
  let html = `<div class="brandmark">${state.settings.mode==='dark'?LOGO_SVG_WHITE:LOGO_SVG_INK}</div>`;

    html += `<div class="navgroup">${esc(t(g.group))}</div>`;

}
function renderTabbar(){
  const tabs = [
    {id:'today', icon:'☀️', label:t('nav_today')}, {id:'spending', icon:'💳', label:t('nav_spending')},
    {id:'__add', icon:'+', label:''},
    {id:'repeats', icon:'🔁', label:t('nav_repeats')}, {id:'__more', icon:'⋯', label:t('show_everything')},
  ];
  return tabs.map(tb=>{

    if(tb.id==='__more') return `<button class="${ui.screen==='settings'?'active':''}" data-action="cmdk-open"><span class="ic">${tb.icon}</span>${esc(tb.label)}</button>`;
    return `<button class="${ui.screen===tb.id?'active':''}" data-action="nav" data-screen="${tb.id}"><span class="ic">${tb.icon}</span>${esc(tb.label)}</button>`;

}
function renderTopbar(){
  const d = new Intl.DateTimeFormat(LOCALE_MAP[state.settings.locale]||'en-US',{weekday:'long', day:'numeric', month:'long'}).format(new Date());
  return `
    <div><div style="font-size:12.5px;color:var(--text-muted)">${esc(d)}</div><div style="font-weight:700">${esc(greeting())}</div></div>

      <button class="${state.settings.appMode==='focus'?'active':''}" data-action="set-appmode" data-mode="focus">${esc(t('focus'))}</button>
      <button class="${state.settings.appMode==='full'?'active':''}" data-action="set-appmode" data-mode="full">${esc(t('full'))}</button>
    </div>
    <button class="iconbtn" data-action="toggle-hide-amounts" title="${esc(t('hide_amounts'))}">${state.settings.hideAmounts?'🙈':'👁️'}</button>
    <button class="iconbtn" data-action="toggle-mode" title="${esc(t('mode'))}">${state.settings.mode==='dark'?'☀️':'🌙'}</button>

  `;
}

function renderScreen(){
  if(state.settings.appMode==='focus' && ui.screen!=='settings'){
    return renderFocusToday();
  }
  switch(ui.screen){
    case 'today': return renderToday();
    case 'spending': return renderSpending();
    case 'repeats': return renderRepeats();
    case 'plan': return renderPlan();
    case 'goals': return renderGoals();
    case 'debt': return renderDebt();
    case 'forecast': return renderForecast();
    case 'year': return renderYear();
    case 'networth': return renderNetWorth();
    case 'reviews': return renderReviews();
    case 'settings': return renderSettings();
    default: return renderToday();
  }
}

function demoBanner(){
  const daysLeft = Math.max(0, DEMO_TRIAL_DAYS - daysBetween(state.demoTrialStart, todayISO()));
  const txCount = state.transactions.length;
  const atLimit = txCount >= DEMO_MAX_TX;
  return `<div class="card soft" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
    <span style="font-size:13px;color:var(--text-muted)">${esc(t('demo_banner'))}${daysLeft} ${esc(t('demo_days_left'))} · <span style="${atLimit?'color:var(--danger);font-weight:700;':''}">${txCount}/${DEMO_MAX_TX} ${esc(t('demo_entry_limit'))}</span></span>
    <div class="row" style="gap:8px;">
      <span class="badge neu">${esc(t('demo_get_full'))}</span>
      <button class="btn small" data-action="reset-demo">${esc(t('reset_demo'))}</button>
    </div>
  </div>`;
}

/* ===================== TODAY / FOCUS ===================== */
function welcomeBackBanner(){
  const days = daysBetween(state.settings.lastBalanceCheck, todayISO());
  if(days<5) return '';
  return `<div class="card" style="background:rgba(var(--accent-rgb),.1); border-color:transparent; margin-bottom:14px;">
    <h3>${esc(t('welcome_back_title'))}</h3><div class="sub" style="margin-bottom:10px">${esc(t('welcome_back_body'))} (${days} ${esc(t('days_left')).replace('days left','days')})</div>
    <button class="btn primary small" data-action="open-check-money">${esc(t('check_my_money'))}</button></div>`;
}
function heroBlock(){
  const safe = computeSafeToSpend();
  const fresh = daysBetween(state.settings.lastBalanceCheck, todayISO()) <= 2;
  const usuals = state.usuals.map(u=>`<button class="chip" data-action="quick-usual" data-id="${u.id}">${u.emoji} ${esc(u.name)} ${fmtMoney(u.amountMinor).replace(/<[^>]+>/g,'')}</button>`).join('');
  return `<div class="hero">
    <div class="overline">${esc(t('safe_today'))}</div>
    <div class="amount" id="hero-amount" data-target="${Math.max(0,safe.safeToday)}">${fmtMoney(Math.max(0,safe.safeToday),{big:true})}</div>
    <div class="sentence">${esc(t('safe_spend_sentence'))}</div>
    <div class="row" style="align-items:center;">
      <span class="freshness ${fresh?'':'fuzzy'}">${fresh?'🟢':'🟡'} ${esc(fresh?t('fresh'):t('fuzzy'))}</span>
      <span class="freshness">${safe.daysLeft} ${esc(t('days_left'))}</span>
    </div>
    <div class="row">
      <button class="btn primary" data-action="open-add-spending">${esc(t('add_spending'))}</button>
      <button class="btn" data-action="open-can-afford">${esc(t('can_i_afford'))}</button>
      <button class="btn" data-action="open-check-money">${esc(t('check_my_money'))}</button>
    </div>
    ${usuals?`<div class="chip-row" style="margin-top:14px;">${usuals}</div>`:''}
  </div>`;
}
function next30Chart(){
  const f = computeForecast(30);
  return chartBlock({
    id:'next30', title:t('next_30_days'),
    sentence: f.gap<0 ? `${t('lowest_point')}: ${fmtMoney(f.lowest.balance).replace(/<[^>]+>/g,'')} (${fmtDate(f.lowest.date)}) — below your protected buffer.` : `${t('lowest_point')}: ${fmtMoney(f.lowest.balance).replace(/<[^>]+>/g,'')} (${fmtDate(f.lowest.date)}).`,
    svg: areaChart(f.points, {threshold:f.protectedThreshold, lowest:f.lowest, title:t('next_30_days')}),
    tableHeaders:[t('date'), t('balance')],
    tableRows: f.points.filter((p,i)=>i%2===0).map(p=>[fmtDate(p.date), fmtMoney(p.balance).replace(/<[^>]+>/g,'')]),
    extraHead:`<a href="#" data-action="nav" data-screen="forecast" style="font-size:12.5px;color:var(--accent);font-weight:600;">${esc(t('nav_forecast'))} →</a>`
  });
}
function worthALookBlock(){
  const spentByCategory = {};
  state.transactions.filter(tx=>tx.direction==='out' && tx.date>=addDays(todayISO(),-7)).forEach(tx=>{ spentByCategory[tx.categoryId]=(spentByCategory[tx.categoryId]||0)+tx.amountMinor; });
  const top = Object.entries(spentByCategory).sort((a,b)=>b[1]-a[1])[0];
  const items=[];
  if(top){ const c=catById(top[0]); if(c) items.push(`${c.emoji} <b>${esc(c.name)}</b> is your biggest spend this week — ${fmtMoney(top[1]).replace(/<[^>]+>/g,'')}.`); }
  const soon = state.repeats.filter(r=>r.kind==='subscription'&&!r.paused).map(r=>({r,d:getNextOccurrence(r,todayISO())})).sort((a,b)=>a.d<b.d?-1:1)[0];
  if(soon && daysBetween(todayISO(),soon.d)<=5) items.push(`${esc(soon.r.name)} renews ${fmtDate(soon.d)} — ${fmtMoney(soon.r.estimatedAmountMinor).replace(/<[^>]+>/g,'')}.`);
  if(!items.length) items.push("Nothing urgent — you're on track.");
  return `<div class="card"><h3>${esc(t('worth_a_look'))}</h3>${items.map(i=>`<div class="list-row" style="font-size:13.5px;">${i}</div>`).join('')}</div>`;
}
function smallWinsBlock(){
  const today = todayISO();
  const ci = state.dailyCheckIns.find(c=>c.date===today) || {date:today, checkedBalance:false, billsTicked:false, loggedSpending:false};
  const wins=[
    {k:'checkedBalance', label:t('check_my_money')}, {k:'billsTicked', label:t('mark_paid')+' / '+t('bills')},
    {k:'loggedSpending', label:t('nothing_today')},
  ];
  const doneCount = wins.filter(w=>ci[w.k]).length;
  const msg = doneCount===0?t('no_streak'):(doneCount===1?t('one_down'):(doneCount===2?t('two_down'):t('three_down')));
  return `<div class="card"><h3>${esc(t('small_wins'))}</h3><div class="sub">${esc(msg)}</div>
    ${wins.map(w=>`<label class="list-row" style="cursor:pointer;">
      <input type="checkbox" data-action="toggle-checkin" data-kind="${w.k}" ${ci[w.k]?'checked':''} style="width:auto;margin-right:8px;">
      <span class="meta t">${esc(w.label)}</span></label>`).join('')}
  </div>`;
}
function comingUpList(limit){
  const horizon = addDays(todayISO(), 30);
  let items = [];
  state.repeats.filter(r=>!r.paused).forEach(r=>{
    nextOccurrencesInRange(r, todayISO(), horizon).forEach(d=>items.push({date:d, repeat:r}));
  });
  items.sort((a,b)=>a.date<b.date?-1:1);
  if(limit) items = items.slice(0,limit);
  if(!items.length) return `<div class="sub">${esc(t('no_data'))}</div>`;
  return items.map(it=>`<div class="list-row">
      <span class="emoji" style="${tintStyle(repeatKindColor(it.repeat.kind))}">${it.repeat.kind==='income'?'💰':(it.repeat.kind==='subscription'?'🔁':'🧾')}</span>
      <div class="meta"><div class="t">${esc(it.repeat.name)}</div><div class="d">${fmtDate(it.date)}</div></div>
      <div class="amt ${it.repeat.kind==='income'?'in':'out'}">${it.repeat.kind==='income'?'+':''}${fmtMoney(it.repeat.estimatedAmountMinor).replace(/<[^>]+>/g,'')}</div>
    </div>`).join('');
}

/* ===================== SPENDING ===================== */
function planBarsBlock(){
  return state.categories.map((c,idx)=>{
    const spent = state.transactions.filter(tx=>tx.direction==='out' && tx.categoryId===c.id && tx.date>=todayISO().slice(0,7)+'-01').reduce((s,tx)=>s+tx.amountMinor,0);
    const plan = c.monthlyPlanMinor||1;
    const pct = clamp(spent/plan,0,1.4);
    const over = spent>plan;
    const col = `var(--${categoryColor(idx)})`;
    return `<div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;">
        <span style="display:inline-flex;align-items:center;gap:7px;"><span class="emoji" style="background:rgba(var(--${categoryColor(idx)}-rgb),.16); width:26px;height:26px;line-height:26px;font-size:14px;">${c.emoji}</span> ${esc(c.name)}</span>
        <span style="color:${over?'var(--danger)':'var(--text)'}; font-weight:${over?'700':'400'};">${fmtMoney(spent).replace(/<[^>]+>/g,'')} / ${fmtMoney(plan).replace(/<[^>]+>/g,'')}</span>
      </div>
      <div style="background:var(--bg-2);border-radius:8px;height:10px;overflow:hidden;">
        <div style="width:${Math.min(100,pct*100)}%;height:100%;background:${over?'linear-gradient(90deg,var(--warning-vivid),var(--danger-vivid))':col}; transition:width .4s ease;"></div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:4px;">
        <button class="btn small ghost" data-action="plan-adjust" data-id="${c.id}" data-delta="-500">−5</button>
        <button class="btn small ghost" data-action="plan-adjust" data-id="${c.id}" data-delta="500">+5</button>
        <button class="iconbtn" data-action="open-entity" data-type="category" data-id="${c.id}" title="${esc(t('edit'))}" style="width:30px;height:30px;font-size:13px;">✎</button>
        <button class="iconbtn" data-action="delete-entity" data-type="categories" data-id="${c.id}" title="${esc(t('delete'))}" style="width:30px;height:30px;font-size:13px;">✕</button>
      </div>
    </div>`;
  }).join('');
}

          <div class="meta"><div class="t">${esc(tx.note||(c?c.name:''))}</div><div class="d">${fmtDate(tx.date)}${tx.tags&&tx.tags.length?' · '+tx.tags.map(esc).join(', '):''}</div></div>

      </div>

          <button class="iconbtn" data-action="delete-entity" data-type="transactions" data-id="${tx.id}">✕</button></div>`).join(''):`<div class="sub">${esc(t('no_data'))}</div>`}
      </div>
    </div>
    <div class="col">
      <div class="card">
        <div class="chart-head"><h3>${esc(t('your_plan'))}</h3>

function repeatRow(r){
  const nextD = getNextOccurrence(r, todayISO());
  const icon = r.kind==='income'?'💰':(r.kind==='subscription'?'🔁':(r.kind==='debtPayment'?'📉':'🧾'));
  return `<div class="list-row">
    <span class="emoji" style="${tintStyle(repeatKindColor(r.kind))}">${icon}</span>
    <div class="meta"><div class="t">${esc(r.name)} ${r.autopay?'<span class="badge neu">'+esc(t('autopay'))+'</span>':''} ${r.paused?'<span class="badge warn">'+esc(t('paused'))+'</span>':''}</div>
      <div class="d">${esc(t(r.schedule.freq))} · ${fmtDate(nextD)}</div></div>

/* ---------- Split-my-pay: horizontal stacked bar ---------- */
function stackedHBar(segments, opts){
  opts = opts||{};
  const w = opts.width||520, h = opts.height||46;
  const total = segments.reduce((s,x)=>s+x.value,0)||1;
  const id = nextChartId('hbar');
  let x = 0, rects = '';
  segments.forEach(seg=>{
    const segW = (seg.value/total)*w;
    const pct = Math.round(seg.value/total*100);
    rects += `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0,segW).toFixed(1)}" height="${h}" fill="var(--${seg.colorVar})" class="${animClass()}"><title>${esc(seg.label)}: ${esc(fmtMoney(seg.value).replace(/<[^>]+>/g,''))} (${pct}%)</title></rect>`;
    if(segW>58){
      rects += `<text x="${(x+segW/2).toFixed(1)}" y="${h/2+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${pct}%</text>`;
    }
    x += segW;
  });
  const clipId = id+'-clip';
  const inner = `<defs><clipPath id="${clipId}"><rect x="0" y="0" width="${w}" height="${h}" rx="${h/2}"/></clipPath></defs>
    <rect x="0" y="0" width="${w}" height="${h}" rx="${h/2}" fill="var(--bg-2)"/>
    <g clip-path="url(#${clipId})">${rects}</g>`;
  const legend = `<div style="display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;">${segments.map(seg=>{
    const pct = Math.round(seg.value/total*100);
    return `<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;">
      <span style="width:11px;height:11px;border-radius:3px;background:var(--${seg.colorVar});display:inline-block;flex-shrink:0;"></span>
      <span>${esc(seg.label)} <b>${pct}%</b> <span style="color:var(--text-muted)">${fmtMoney(seg.value).replace(/<[^>]+>/g,'')}</span></span>
    </div>`;
  }).join('')}</div>`;
  return svgShell(id, w, h, opts.title||t('split_my_pay'), opts.desc||'', inner, '', 'none')+legend;
}
function splitPayBarBlock(){
  const salary = state.repeats.find(r=>r.kind==='income');
  if(!salary) return `<div class="sub">${esc(t('no_data'))}</div>`;
  const total = salary.estimatedAmountMinor;
  const bills = activeRepeats(['bill','debtPayment']).reduce((s,r)=>s+r.estimatedAmountMinor,0);
  const subs = activeRepeats(['subscription']).reduce((s,r)=>s+r.estimatedAmountMinor,0);
  const goalsOut = state.goals.reduce((s,g)=>s+g.monthlyContributionMinor,0);
  const leftover = Math.max(0, total-bills-subs-goalsOut);
  const segments = [
    {label:t('bills'), value:bills, colorVar:'cat-2'},
    {label:t('subscriptions'), value:subs, colorVar:'cat-7'},
    {label:t('goals'), value:goalsOut, colorVar:'cat-5'},
    {label:t('left_over'), value:leftover, colorVar:'cat-3'},
  ].filter(s=>s.value>0);
  return chartBlock({id:'splitpay', title:t('split_my_pay'), sentence:`${fmtMoney(leftover).replace(/<[^>]+>/g,'')} ${t('left_over').toLowerCase()} after bills, subscriptions and goals.`,
    svg: stackedHBar(segments), tableHeaders:[t('category'),t('amount')], tableRows:segments.map(s=>[esc(s.label), fmtMoney(s.value).replace(/<[^>]+>/g,'')])});
}

/* ===================== REVIEWS ===================== */
function last30Heatmap(){
  const days = Array.from({length:30},(_,i)=>addDays(todayISO(),-(29-i)));
  const byDay = {};
  state.transactions.filter(tx=>tx.direction==='out').forEach(tx=>{ byDay[tx.date]=(byDay[tx.date]||0)+tx.amountMinor; });
  const max = Math.max(...days.map(d=>byDay[d]||0),1);
  return days.map(d=>({date:d, intensity:(byDay[d]||0)/max, noSpend: !byDay[d]}));
}
function recapCarousel(score){
  const slides = [
    `<div class="card soft cardslide"><h3>${esc(t('money_health'))}</h3>${ringChart(score.total,100,110)}</div>`,
    `<div class="card soft cardslide"><h3>${esc(t('no_streak'))}</h3><div style="font-size:30px;font-weight:700;">${state.dailyCheckIns.filter(c=>c.date>=addDays(todayISO(),-30)&&!state.transactions.some(tx=>tx.date===c.date&&tx.direction==='out')).length}</div><div class="sub">no-spend days (30d)</div></div>`,
    `<div class="card soft cardslide"><h3>${esc(t('cashflow'))}</h3><div style="font-size:30px;font-weight:700;">${Math.round(score.savingsRate*100)}%</div><div class="sub">savings rate</div></div>`,
    `<div class="card soft cardslide"><h3>${esc(t('safety_net'))}</h3><div style="font-size:30px;font-weight:700;">${score.netMonths.toFixed(1)} mo</div></div>`,
  ];
  return `<div class="carousel">${slides.join('')}</div>`;
}
function renderReviews(){
  const score = moneyHealthScore();
  const nw = netWorthNow();
  const income = activeRepeats(['income']).reduce((s,r)=>s+r.estimatedAmountMinor,0);
  const billsTotal = activeRepeats(['bill']).reduce((s,r)=>s+r.estimatedAmountMinor,0);
  const everydaySpend = avgDailySpend(30)*30.44;
  const leftover = Math.max(0, income-billsTotal-everydaySpend);
  const sankeyLeft=[{id:'in',label:t('income'),value:income||1}];
  const sankeyRight=[{id:'bills',label:t('bills'),value:billsTotal},{id:'everyday',label:'Everyday',value:everydaySpend},{id:'left',label:t('left_over'),value:leftover}].filter(n=>n.value>0);

  const subs=[{k:'cashflow',v:score.cashflow,c:'cat-1'},{k:'cushion',v:score.cushion,c:'cat-3'},{k:'debt_load',v:score.debtLoad,c:'cat-8'},{k:'bills_ticked',v:score.billsTicked,c:'cat-4'},{k:'kept_up',v:score.keptUp,c:'cat-7'}];
  return `<div class="overline">${esc(t('nav_reviews'))}</div><h1 class="screen-title">${esc(t('nav_reviews'))}</h1>
  <div class="grid-23">
    <div class="col">

        <div style="display:flex;justify-content:center;">${ringChart(score.total,100,140)}</div>

          ${subs.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;margin-bottom:6px;">
            <span style="width:90px;">${esc(t(s.k))}</span>${gaugeBar(s.v/20,140,8,`var(--${s.c})`)}<span>${s.v}/20</span></div>`).join('')}
        </div>
      </div>
      ${chartBlock({id:'reviewsankey', title:t('where_money_went'), sentence:`${fmtMoney(leftover).replace(/<[^>]+>/g,'')} left over after bills and everyday spending.`,
        svg: sankeyChart(sankeyLeft,sankeyRight,sankeyFlows), tableHeaders:['Category','Amount'], tableRows:sankeyRight.map(n=>[esc(n.label), fmtMoney(n.value).replace(/<[^>]+>/g,'')])})}
      ${chartBlock({id:'waterfall', title:t('how_month_added_up'), sentence:`You kept ${fmtMoney(leftover).replace(/<[^>]+>/g,'')} this month.`,
        svg: waterfallChart(waterfallSteps), tableHeaders:['Step','Amount'], tableRows:waterfallSteps.map(s=>[esc(s.label), fmtMoney(s.value).replace(/<[^>]+>/g,'')])})}
    </div>
    <div class="col">
      <div class="card"><h3>${esc(t('monthly_recap'))}</h3>${recapCarousel(score)}</div>

/* ===================== CSV / BACKUP ===================== */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
}
function exportCSV(){
  const rows = [['date','amount','direction','category','note','tags']];
  state.transactions.forEach(tx=>{
    const c = catById(tx.categoryId);
    rows.push([tx.date, (tx.amountMinor/100).toFixed(2), tx.direction, c?c.name:'', tx.note||'', (tx.tags||[]).join('|')]);
  });
  const csv = rows.map(r=>r.map(f=>`"${String(f).replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadFile('transactions.csv', csv, 'text/csv');
}
function parseCSV(text){
  const delim = text.includes(';') && !text.split('\n')[0].includes(',') ? ';' : ',';
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  const rows = lines.map(line=>{
    const out=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(c==='"'){ inQ=!inQ; continue; }
      if(c===delim && !inQ){ out.push(cur); cur=''; continue; }
      cur+=c;
    }
    out.push(cur);
    return out;
  });
  return {delim, rows};
}
function guessColumns(header){
  const idx = {date:-1, amount:-1, note:-1};
  header.forEach((h,i)=>{
    const low = h.toLowerCase();
    if(idx.date<0 && /date|datum|fecha|data/.test(low)) idx.date=i;
    if(idx.amount<0 && /amount|montant|betrag|importe|importo|value/.test(low)) idx.amount=i;
    if(idx.note<0 && /desc|memo|note|label|libell|concept/.test(low)) idx.note=i;
  });
  if(idx.date<0) idx.date=0; if(idx.amount<0) idx.amount=header.length>2?2:1; if(idx.note<0) idx.note=1;
  return idx;
}
function parseAmountLocal(str, delim){
  str = str.trim().replace(/[^\d,.\-]/g,'');
  if(delim===';'){ str = str.replace(/\./g,'').replace(',', '.'); }
  else if(str.includes(',') && !str.includes('.')) str = str.replace(',', '.');
  else str = str.replace(/,/g,'');
  return Math.round(parseFloat(str||'0')*100);
}
function importCSVFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    const {delim, rows} = parseCSV(reader.result);
    if(rows.length<2) return;
    const header = rows[0];
    const idx = guessColumns(header);
    const batchId = uid();
    let added=0, dup=0, capped=0;
    for(let i=1;i<rows.length;i++){
      if(state.transactions.length >= DEMO_MAX_TX){ capped = rows.length-i; break; }
      const r = rows[i]; if(!r || r.length<2) continue;
      const rawDate = (r[idx.date]||'').trim();
      let iso = rawDate;
      const m = rawDate.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
      if(m){ let [,_d,_m2,_y]=m; if(_y.length===2) _y='20'+_y; iso = `${_y}-${_m2.padStart(2,'0')}-${_d.padStart(2,'0')}`; }
      const amountMinor = parseAmountLocal(r[idx.amount]||'0', delim);
      const note = (r[idx.note]||'').trim();
      if(!iso || !amountMinor) continue;
      const dupExists = state.transactions.some(tx=>tx.date===iso && tx.amountMinor===Math.abs(amountMinor) && tx.note===note);
      if(dupExists){ dup++; continue; }
      let categoryId=null, tags=[];
      for(const rule of state.importRules){
        if(note.toLowerCase().includes(rule.match.toLowerCase())){ categoryId=rule.setCategory||categoryId; tags=rule.setTags||tags; break; }
      }
      const direction = amountMinor<0 ? 'out':'in';
      state.transactions.push({id:uid(), amountMinor:Math.abs(amountMinor), direction, date:iso, categoryId, splits:[], tags, note, accountId: state.accounts[0]?.id, importBatchId:batchId});
      added++;
    }
    saveState(); ui.lastImportBatch=batchId;
    showToast(capped>0 ? `Imported ${added} (${dup} duplicates, ${capped} skipped — ${t('demo_limit_reached')})` : `Imported ${added} (${dup} duplicates skipped).`, true, ()=>undoImport(batchId));
    renderApp();
  };
  reader.readAsText(file);
}
function undoImport(batchId){
  state.transactions = state.transactions.filter(tx=>tx.importBatchId!==batchId);
  saveState(); renderApp();
}

async function deriveKey(passphrase, salt){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
function bufToB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64){ return Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); }
async function exportBackup(passphrase){
  const json = JSON.stringify(state);
  if(!passphrase){ downloadFile('budget-backup.json', json, 'application/json'); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(passphrase, salt);
  const enc = new TextEncoder();
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(json));
  const payload = JSON.stringify({encrypted:true, salt:bufToB64(salt), iv:bufToB64(iv), data:bufToB64(cipher), checksum: json.length});
  downloadFile('budget-backup.json', payload, 'application/json');
}
async function importBackupFile(file, passphrase){
  const text = await file.text();
  let obj;
  try{ obj = JSON.parse(text); }catch(e){ showToast('That file could not be read.', false); return; }
  if(obj.encrypted){
    try{
      const salt = b64ToBuf(obj.salt), iv = b64ToBuf(obj.iv), data = b64ToBuf(obj.data);
      const key = await deriveKey(passphrase||'', salt);
      const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
      const json = new TextDecoder().decode(plain);
      const verified = JSON.parse(json);
      if(verified.length !== undefined || verified.checksum || JSON.stringify(json).length){ /* basic sanity */ }
      state = migrateState(JSON.parse(json));
      state.settings.demo = false;
    }catch(e){ showToast('Wrong passphrase or corrupted backup.', false); return; }
  } else {
    state = migrateState(obj); state.settings.demo = false;
  }
  let trimmed = false;
  if(state.transactions.length > DEMO_MAX_TX){
    state.transactions.sort((a,b)=>a.date<b.date?1:-1);
    state.transactions = state.transactions.slice(0, DEMO_MAX_TX);
    trimmed = true;
  }
  saveState(); ui.modal=null; renderApp();
  showToast(trimmed ? `Backup restored — kept the 20 most recent entries. ${t('demo_limit_reached')}` : 'Backup restored.', false);
}

function recordTransaction(){
  const a = ui.addSpend;
  if(a.amountMinor<=0){ closeSheet(); return; }
  if(state.transactions.length >= DEMO_MAX_TX){
    ui.modal=null;
    showToast(t('demo_limit_reached'), false);
    return;
  }
  const tx = {id:uid(), amountMinor:a.amountMinor, direction:a.dir, date:a.date, categoryId:a.dir==='out'?a.categoryId:null, splits:[], tags:a.tags?a.tags.split(',').map(s=>s.trim()).filter(Boolean):[], note:a.note, accountId:a.accountId, importBatchId:null};
  state.transactions.push(tx);
  const acc = accById(a.accountId);
  if(acc) acc.balanceMinor += (a.dir==='out'? -a.amountMinor : a.amountMinor);
  let ci = state.dailyCheckIns.find(c=>c.date===todayISO());
  if(!ci){ ci={date:todayISO(), checkedBalance:false, billsTicked:false, loggedSpending:false}; state.dailyCheckIns.push(ci); }
  ci.loggedSpending = true;
  saveState(); ui.modal=null;
  showToast(`${a.dir==='out'?'-':'+'}${fmtMoney(a.amountMinor,{}).replace(/<[^>]+>/g,'')} recorded.`, true, ()=>undoTransaction(tx.id));
}
function undoTransaction(id){
  const tx = state.transactions.find(x=>x.id===id);
  if(tx){ const acc=accById(tx.accountId); if(acc) acc.balanceMinor -= (tx.direction==='out'? -tx.amountMinor : tx.amountMinor); }
  state.transactions = state.transactions.filter(x=>x.id!==id);
  saveState(); renderApp();
}

  document.addEventListener('change', handleGlobalChange);
  document.addEventListener('keydown', (ev)=>{
    if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==='k'){ ev.preventDefault(); ui.cmdkOpen=!ui.cmdkOpen; ui.cmdkQuery=''; renderApp(); if(ui.cmdkOpen){ const i=document.getElementById('cmdk-input'); if(i) i.focus(); } }
    if(ev.key==='Escape' && (ui.modal || ui.cmdkOpen)){ ui.modal=null; ui.cmdkOpen=false; renderApp(); }
  });
  renderApp();
  if(DEMO_JUST_RESET){ DEMO_JUST_RESET=false; showToast(t('demo_reset_notice'), false); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
</body>
</html>
